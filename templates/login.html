<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Timelog</title>
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <h1>Timelog</h1>
    {% if not configured %}
      <p>No password is set yet. On the server, run <code>python app.py set-password</code>.</p>
    {% else %}
      {% if error == "invalid" %}<p class="form-error" role="alert">Wrong password.</p>{% endif %}
      {% if error == "locked" %}<p class="form-error" role="alert">Too many attempts. Try again in 15 minutes.</p>{% endif %}
      <form method="post" action="/login">
        <label>Password
          <input type="password" name="password" autocomplete="current-password" required autofocus>
        </label>
        <button class="primary" type="submit">Log in</button>
      </form>
    {% endif %}
  </main>
</body>
</html>
