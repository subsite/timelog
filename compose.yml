services:
  timelog:
    build:
      context: .
      args:
        # deploy.sh sets this to the release being deployed.
        TIMELOG_VERSION: ${TIMELOG_VERSION:-unknown}
    restart: unless-stopped
    # GitHub sign-in settings; see .env.example.
    env_file: .env
    ports:
      # Local only: put an HTTPS reverse proxy in front.
      - "127.0.0.1:8000:8000"
    volumes:
      - timelog-data:/data

volumes:
  timelog-data:
